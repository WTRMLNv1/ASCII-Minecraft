name: Release Windows executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained release executable
        run: cargo build --release --locked

      - name: Name the downloadable release asset
        run: Copy-Item target/release/asciimln.exe asciimln-windows-x86_64.exe

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: asciimln-windows-x86_64.exe
          name: AsciiMLN ${{ github.ref_name }}
          fail_on_unmatched_files: true
